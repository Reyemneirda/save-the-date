<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mariage Adrien & Alina</title>
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Mariage Adrien & Alina — 5 octobre 2026" />
    <meta property="og:type" content="website" />

    <!--
    ╔══════════════════════════════════════════════════════════════════════╗
    ║   SITE RSVP MARIAGE — ADRIEN & ALINA · 5 octobre 2026                ║
    ║   Beit Andromeda, Amiad 4, Jaffa · Tel Aviv-Jaffa                    ║
    ╠══════════════════════════════════════════════════════════════════════╣
    ║  Style "Sharon & Lucas" (bleu marine + crème, Niconne).             ║
    ║  Sections : programme, lieu, hébergement, infos pratiques, RSVP,     ║
    ║  cadeau, footer.  Langues : FR / EN / HE (RTL) / RU.                ║
    ║                                                                      ║
    ║  📊 BACKEND : MÊME Google Sheet que le save-the-date (Sheet1 A→N).  ║
    ║  🚀 DÉPLOIEMENT GitHub Pages : voir README.md                       ║
    ╚══════════════════════════════════════════════════════════════════════╝
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Niconne&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Josefin+Sans:wght@300;400;500&family=Frank+Ruhl+Libre:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ============================================= */
      /*   🎨 THÈME — BLEU MARINE & CRÈME             */
      /* ============================================= */
      :root {
        --navy: #253a53;
        --navy-deep: #1c2d40;
        --navy-soft: #2d4665;
        --cream: #f2ddc9;
        --cream-bright: #fbe0c5;
        --cream-muted: rgba(242, 221, 201, 0.82);
        --line: rgba(242, 221, 201, 0.22);
        --error: #e8a0a0;
        --success: #a7d3a0;

        --font-script: "Niconne", cursive;
        --font-display: "Cormorant Garamond", serif;
        --font-body: "Josefin Sans", sans-serif;
      }

      [dir="rtl"] {
        --font-display: "Frank Ruhl Libre", serif;
        --font-body: "Frank Ruhl Libre", sans-serif;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html { scroll-behavior: smooth; }

      body {
        font-family: var(--font-body);
        color: var(--cream);
        background-color: var(--navy);
        background-image:
          radial-gradient(ellipse at 20% 0%, rgba(45, 70, 101, 0.7) 0%, transparent 55%),
          radial-gradient(ellipse at 80% 100%, rgba(45, 70, 101, 0.6) 0%, transparent 55%);
        background-attachment: fixed;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      img { max-width: 100%; display: block; }

      /* ============== BARRE FIXE ============== */
      .top-bar {
        position: fixed; top: 1rem; right: 1.2rem; z-index: 200;
        display: flex; align-items: center; gap: 0.5rem;
      }
      [dir="rtl"] .top-bar { right: auto; left: 1.2rem; }
      .music-btn {
        background: var(--cream); border: none;
        width: 38px; height: 38px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; border-radius: 50%;
        color: var(--navy); font-size: 0.95rem;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        transition: transform 0.3s ease;
      }
      .music-btn:hover { transform: scale(1.1); }
      .lang-switcher { display: flex; gap: 0.3rem; }
      .lang-btn {
        background: rgba(242, 221, 201, 0.12);
        border: 1px solid var(--line);
        padding: 0.3rem 0.55rem;
        font-family: var(--font-body); font-size: 0.62rem;
        letter-spacing: 0.05em; color: var(--cream);
        cursor: pointer; border-radius: 6px; transition: all 0.3s ease;
      }
      .lang-btn:hover, .lang-btn.active { background: var(--cream); color: var(--navy); }

      /* ============== SECTIONS ============== */
      section { position: relative; padding: 5.5rem 1.5rem; }
      .wrap { max-width: 1040px; margin: 0 auto; }
      .wrap-narrow { max-width: 680px; margin: 0 auto; }
      .section-alt { background: rgba(28, 45, 64, 0.55); }

      .eyebrow {
        font-family: var(--font-body); font-size: 0.7rem; font-weight: 400;
        letter-spacing: 0.32em; text-transform: uppercase;
        color: var(--cream-muted); text-align: center;
      }
      .h-section {
        font-family: var(--font-script);
        font-size: clamp(2.6rem, 7vw, 4rem);
        text-align: center; margin-bottom: 1.5rem;
      }
      .lede {
        font-family: var(--font-display); font-size: 1.15rem; line-height: 1.8;
        color: var(--cream-muted); text-align: center;
        max-width: 600px; margin: 0 auto;
      }
      .divider {
        display: flex; align-items: center; gap: 1rem;
        margin: 1.6rem auto; max-width: 220px;
      }
      .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      .divider span { color: var(--cream); font-size: 0.9rem; }

      /* ============== HERO ============== */
      .hero {
        min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        padding-top: 6rem; padding-bottom: 5rem;
      }
      .hero-eyebrow {
        font-family: var(--font-body); font-size: 0.72rem;
        letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--cream-muted); max-width: 520px; line-height: 2;
        margin-bottom: 1.8rem; animation: fadeUp 1s ease-out 0.2s both;
      }
      .hero-names {
        font-family: var(--font-script);
        font-size: clamp(3.4rem, 13vw, 6.5rem); line-height: 1;
        animation: fadeUp 1s ease-out 0.4s both;
      }
      .hero-names .amp { display: block; font-size: 0.5em; margin: 0.1em 0; color: var(--cream-bright); }
      .hero-date {
        font-family: var(--font-body); font-size: 1.1rem;
        letter-spacing: 0.3em; text-transform: uppercase; margin-top: 1.6rem;
        animation: fadeUp 1s ease-out 0.6s both;
      }
      .hero-venue {
        font-family: var(--font-display); font-style: italic; font-size: 1.2rem;
        color: var(--cream-muted); margin-top: 0.6rem;
        animation: fadeUp 1s ease-out 0.7s both;
      }
      .countdown {
        display: flex; justify-content: center; gap: 1.6rem; margin-top: 2.4rem;
        animation: fadeUp 1s ease-out 0.9s both;
      }
      .cd-num { font-family: var(--font-script); font-size: 2.6rem; line-height: 1; color: var(--cream-bright); }
      .cd-label {
        font-family: var(--font-body); font-size: 0.58rem;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--cream-muted); margin-top: 0.4rem;
      }
      .scroll-hint {
        margin-top: 3rem; display: flex; flex-direction: column;
        align-items: center; gap: 0.6rem; cursor: pointer;
        animation: fadeUp 1s ease-out 1.1s both;
      }
      .scroll-hint span {
        font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase;
        color: var(--cream-muted);
      }
      .scroll-arrow {
        width: 18px; height: 18px;
        border-right: 2px solid var(--cream); border-bottom: 2px solid var(--cream);
        transform: rotate(45deg); animation: bounce 2s ease-in-out infinite;
      }
      @keyframes bounce {
        0%, 100% { transform: rotate(45deg) translateY(0); opacity: 1; }
        50% { transform: rotate(45deg) translateY(7px); opacity: 0.5; }
      }

      /* ============== PROGRAMME (timeline) ============== */
      .timeline {
        max-width: 620px; margin: 2.5rem auto 0;
        position: relative;
      }
      .tl-item {
        display: grid; grid-template-columns: 90px 1fr; gap: 1.2rem;
        padding: 1.1rem 0;
        border-bottom: 1px solid rgba(242, 221, 201, 0.12);
      }
      .tl-item:last-child { border-bottom: none; }
      .tl-time {
        font-family: var(--font-script); font-size: 1.7rem;
        color: var(--cream-bright); line-height: 1; padding-top: 0.1rem;
      }
      [dir="rtl"] .tl-item { grid-template-columns: 1fr 90px; }
      .tl-title {
        font-family: var(--font-display); font-size: 1.3rem; font-weight: 500;
        color: var(--cream); margin-bottom: 0.2rem;
      }
      .tl-desc { font-family: var(--font-display); font-size: 1.02rem; color: var(--cream-muted); }

      /* ============== LIEU ============== */
      .venue-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem;
        align-items: center; margin-top: 2.5rem;
      }
      .venue-text p {
        font-family: var(--font-display); font-size: 1.15rem; line-height: 1.9;
        color: var(--cream); margin-bottom: 0.4rem;
      }
      .bullet {
        display: flex; gap: 0.7rem; align-items: baseline; margin-top: 1.1rem;
        font-family: var(--font-display); font-size: 1.08rem; color: var(--cream-muted);
      }
      .bullet .ic { color: var(--cream-bright); font-size: 0.85rem; flex-shrink: 0; }
      .bullet a { color: var(--cream); border-bottom: 1px solid var(--line); text-decoration: none; }
      .bullet a:hover { border-color: var(--cream); }
      .map-frame iframe {
        width: 100%; height: 320px; border: 1px solid var(--line);
        border-radius: 12px; filter: saturate(0.9);
      }
      .nav-buttons { display: flex; gap: 0.8rem; margin-top: 1.3rem; }
      .nav-btn {
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.7rem 1.3rem; border-radius: 8px;
        font-family: var(--font-body); font-size: 0.7rem;
        letter-spacing: 0.12em; text-transform: uppercase;
        text-decoration: none; color: var(--navy); background: var(--cream);
        transition: transform 0.2s ease;
      }
      .nav-btn:hover { transform: translateY(-3px); }
      .nav-btn svg { width: 18px; height: 18px; }

      /* ============== HÉBERGEMENT (quartiers) ============== */
      .area-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;
        margin-top: 2.5rem;
      }
      .area-card {
        background: rgba(242, 221, 201, 0.06);
        border: 1px solid var(--line); border-radius: 12px;
        padding: 1.5rem 1.4rem;
      }
      .area-card h3 {
        font-family: var(--font-script); font-size: 1.9rem;
        color: var(--cream-bright); margin-bottom: 0.2rem;
      }
      .area-dist {
        font-family: var(--font-body); font-size: 0.6rem;
        letter-spacing: 0.15em; text-transform: uppercase;
        color: var(--cream-muted); margin-bottom: 0.7rem;
      }
      .area-card p {
        font-family: var(--font-display); font-size: 1.04rem; line-height: 1.6;
        color: var(--cream-muted);
      }
      .area-note {
        font-family: var(--font-display); font-style: italic; font-size: 1.02rem;
        color: var(--cream-muted); text-align: center; margin-top: 1.8rem;
      }
      .area-note a { color: var(--cream); border-bottom: 1px solid var(--line); text-decoration: none; }

      /* ============== INFOS PRATIQUES ============== */
      .tips-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;
        margin-top: 2.5rem;
      }
      .tip {
        display: flex; gap: 1rem; align-items: flex-start;
      }
      .tip .tip-ic { font-size: 1.6rem; flex-shrink: 0; line-height: 1.2; }
      .tip h4 {
        font-family: var(--font-display); font-size: 1.25rem; font-weight: 500;
        color: var(--cream); margin-bottom: 0.25rem;
      }
      .tip p { font-family: var(--font-display); font-size: 1.02rem; line-height: 1.55; color: var(--cream-muted); }
      .tip a { color: var(--cream); border-bottom: 1px solid var(--line); text-decoration: none; }

      /* ============== FORMULAIRE RSVP ============== */
      .rsvp-card {
        max-width: 640px; margin: 2.5rem auto 0;
        background: rgba(242, 221, 201, 0.06);
        border: 1px solid var(--line); border-radius: 16px;
        padding: 2.5rem 2.2rem;
      }
      .form-group { margin-bottom: 1.4rem; text-align: left; }
      [dir="rtl"] .form-group { text-align: right; }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .form-label {
        display: block; font-family: var(--font-body); font-size: 0.64rem;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--cream-muted); margin-bottom: 0.5rem;
      }
      .form-input, .form-textarea {
        width: 100%; padding: 0.8rem 1rem;
        font-family: var(--font-body); font-size: 0.95rem; color: var(--cream);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line); border-radius: 8px; outline: none;
        transition: border-color 0.3s ease;
        -webkit-appearance: none; appearance: none;
      }
      .form-input::placeholder { color: rgba(242, 221, 201, 0.4); }
      .form-input:focus, .form-textarea:focus { border-color: var(--cream); }
      .form-textarea { resize: vertical; min-height: 80px; }
      .comes-toggle { display: flex; gap: 0.6rem; margin-top: 0.3rem; }
      .comes-btn {
        flex: 1; padding: 0.85rem 0.8rem;
        font-family: var(--font-body); font-size: 0.85rem;
        border: 1px solid var(--line); border-radius: 8px;
        background: rgba(255, 255, 255, 0.04); color: var(--cream-muted);
        cursor: pointer; transition: all 0.3s ease;
      }
      .comes-btn:hover { border-color: var(--cream); color: var(--cream); }
      .comes-btn.active { background: var(--cream); border-color: var(--cream); color: var(--navy); font-weight: 500; }
      .comes-hint {
        font-family: var(--font-display); font-style: italic; font-size: 0.9rem;
        color: var(--cream-muted); margin-top: 0.6rem;
      }
      .checkbox-group { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1.4rem; }
      [dir="rtl"] .checkbox-group { flex-direction: row-reverse; }
      .form-checkbox { width: 18px; height: 18px; accent-color: var(--cream); cursor: pointer; flex-shrink: 0; }
      .checkbox-label { font-family: var(--font-display); font-size: 1rem; color: var(--cream); cursor: pointer; }
      .form-hint {
        display: block; font-family: var(--font-display); font-style: italic;
        font-size: 0.85rem; color: var(--cream-muted); margin-top: 0.35rem;
      }
      #comes-details { transition: opacity 0.3s ease, max-height 0.3s ease; overflow: hidden; }
      #comes-details.hidden { opacity: 0; max-height: 0; margin: 0; pointer-events: none; }
      .btn-primary {
        display: inline-block; margin-top: 0.6rem; padding: 0.95rem 3rem;
        font-family: var(--font-body); font-size: 0.72rem;
        letter-spacing: 0.25em; text-transform: uppercase;
        color: var(--navy); background: var(--cream);
        border: none; border-radius: 8px; cursor: pointer;
        transition: transform 0.25s ease, background 0.25s ease;
      }
      .btn-primary:hover:not(:disabled) { transform: translateY(-3px); background: var(--cream-bright); }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      .form-status { margin-top: 1.2rem; font-family: var(--font-body); font-size: 0.78rem; min-height: 1.4em; }
      .form-status.sending { color: var(--cream-muted); }
      .form-status.success { color: var(--success); }
      .form-status.error { color: var(--error); }
      .success-message { display: none; text-align: center; padding: 1.5rem 0; }
      .success-message.visible { display: block; }
      .success-icon { font-size: 2.4rem; color: var(--cream-bright); margin-bottom: 1rem; }
      .success-text { font-family: var(--font-script); font-size: 2.2rem; margin-bottom: 0.5rem; }
      .success-sub { font-family: var(--font-display); font-size: 1.05rem; color: var(--cream-muted); line-height: 1.6; }

      /* ============== CADEAU ============== */
      .gift-cta { text-align: center; }
      .btn-outline {
        display: inline-block; margin-top: 1.6rem; padding: 0.95rem 2.8rem;
        font-family: var(--font-body); font-size: 0.72rem;
        letter-spacing: 0.25em; text-transform: uppercase;
        color: var(--cream); background: transparent;
        border: 1px solid var(--cream); border-radius: 8px;
        text-decoration: none; transition: all 0.25s ease;
      }
      .btn-outline:hover { background: var(--cream); color: var(--navy); transform: translateY(-3px); }

      /* ============== FOOTER ============== */
      footer { background: var(--navy-deep); padding: 4rem 1.5rem 2.5rem; }
      .footer-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 2.5rem;
        max-width: 760px; margin: 0 auto; text-align: center;
      }
      .footer-grid h4 {
        font-family: var(--font-script); font-size: 1.6rem;
        color: var(--cream-bright); margin-bottom: 1rem;
      }
      .footer-grid p, .footer-grid a {
        font-family: var(--font-display); font-size: 1.02rem;
        color: var(--cream-muted); text-decoration: none; line-height: 1.7; display: block;
      }
      .footer-grid a:hover { color: var(--cream); }
      .footer-credit {
        text-align: center; margin-top: 3rem;
        font-family: var(--font-body); font-size: 0.65rem;
        letter-spacing: 0.1em; color: rgba(242, 221, 201, 0.45);
      }

      /* ============== ANIMATIONS ============== */
      @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.9s ease, transform 0.9s ease; }
      .reveal.in { opacity: 1; transform: translateY(0); }

      /* ============== RESPONSIVE ============== */
      @media (max-width: 760px) {
        section { padding: 4rem 1.3rem; }
        .venue-grid, .area-grid, .tips-grid { grid-template-columns: 1fr; gap: 1.6rem; }
        .form-row { grid-template-columns: 1fr; }
        .footer-grid { grid-template-columns: 1fr; gap: 2rem; }
        .countdown { gap: 1.1rem; }
        .cd-num { font-size: 2.1rem; }
        .rsvp-card { padding: 2rem 1.3rem; }
        .nav-buttons { flex-wrap: wrap; }
        .tl-item { grid-template-columns: 70px 1fr; gap: 0.9rem; }
        [dir="rtl"] .tl-item { grid-template-columns: 1fr 70px; }
        .tl-time { font-size: 1.4rem; }
      }
    </style>
  </head>
  <body>
    <!-- Barre fixe : musique + langue -->
    <div class="top-bar">
      <button class="music-btn" id="music-btn" onclick="toggleMusic()" aria-label="Musique">▶</button>
      <nav class="lang-switcher" aria-label="Langue">
        <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" data-lang="he" onclick="setLang('he')">עב</button>
        <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">РУ</button>
      </nav>
    </div>
    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <!-- ============================ HERO ============================ -->
    <section class="hero" id="hero">
      <p class="hero-eyebrow" data-i18n="hero_eyebrow"></p>
      <h1 class="hero-names" id="hero-names"></h1>
      <p class="hero-date" data-i18n="date"></p>
      <p class="hero-venue" data-i18n="venue"></p>
      <div class="countdown" id="countdown"></div>
      <div class="scroll-hint" onclick="document.getElementById('program').scrollIntoView({behavior:'smooth'})">
        <span data-i18n="scroll"></span>
        <div class="scroll-arrow"></div>
      </div>
    </section>

    <!-- ========================= PROGRAMME ========================== -->
    <section id="program" class="section-alt">
      <div class="wrap-narrow reveal">
        <p class="eyebrow" data-i18n="program_eyebrow"></p>
        <h2 class="h-section" data-i18n="program_title"></h2>
        <p class="lede" data-i18n="program_intro"></p>
        <div class="divider"><span>✦</span></div>

        <div class="timeline">
          <div class="tl-item">
            <div class="tl-time">17h30</div>
            <div><div class="tl-title" data-i18n="prog_1_t"></div><div class="tl-desc" data-i18n="prog_1_d"></div></div>
          </div>
          <div class="tl-item">
            <div class="tl-time">18h30</div>
            <div><div class="tl-title" data-i18n="prog_2_t"></div><div class="tl-desc" data-i18n="prog_2_d"></div></div>
          </div>
          <div class="tl-item">
            <div class="tl-time">19h15</div>
            <div><div class="tl-title" data-i18n="prog_3_t"></div><div class="tl-desc" data-i18n="prog_3_d"></div></div>
          </div>
          <div class="tl-item">
            <div class="tl-time">20h30</div>
            <div><div class="tl-title" data-i18n="prog_4_t"></div><div class="tl-desc" data-i18n="prog_4_d"></div></div>
          </div>
          <div class="tl-item">
            <div class="tl-time">00h30</div>
            <div><div class="tl-title" data-i18n="prog_5_t"></div><div class="tl-desc" data-i18n="prog_5_d"></div></div>
          </div>
        </div>
      </div>
    </section>

    <!-- =========================== LIEU ============================ -->
    <section id="venue">
      <div class="wrap reveal">
        <p class="eyebrow" data-i18n="venue_eyebrow"></p>
        <h2 class="h-section" data-i18n="venue_title"></h2>
        <div class="divider"><span>✦</span></div>

        <div class="venue-grid">
          <div class="venue-text">
            <p data-i18n="venue_text"></p>
            <div class="bullet">
              <span class="ic">📍</span>
              <span><a href="https://maps.app.goo.gl/w4T8jLC897ukvtBV8" target="_blank" rel="noopener noreferrer" data-i18n="venue_address"></a></span>
            </div>
            <div class="bullet">
              <span class="ic">🚕</span>

      /* ==========================================================
       *  ⚙️ LOGIQUE
       * ========================================================== */
      const RTL_LANGS = ["he", "ar"];
      let currentLang = "fr";

      function detectLang() {
        const langs = navigator.languages
          ? navigator.languages.map((l) => l.substring(0, 2))
          : [navigator.language.substring(0, 2)];
        const supported = Object.keys(TRANSLATIONS);
        for (const l of langs) if (supported.includes(l)) return l;
        return "fr";
      }

      /* ---------- Musique ---------- */
      const bgMusic = document.getElementById("bg-music");
      const musicBtn = document.getElementById("music-btn");
      function startMusic() {
        if (bgMusic.paused) {
          bgMusic.play().then(() => { musicBtn.textContent = "⏸"; }).catch(() => {});
        }
      }
      function autoplayOnce() {
        startMusic();
        document.removeEventListener("click", autoplayOnce);
        document.removeEventListener("touchstart", autoplayOnce);
        document.removeEventListener("scroll", autoplayOnce);
      }
      document.addEventListener("click", autoplayOnce, { once: true });
      document.addEventListener("touchstart", autoplayOnce, { once: true });
      document.addEventListener("scroll", autoplayOnce, { once: true });
      function toggleMusic() {
        if (bgMusic.paused) { bgMusic.play(); musicBtn.textContent = "⏸"; }
        else { bgMusic.pause(); musicBtn.textContent = "▶"; }
      }

      /* ---------- Langue ---------- */
      function setLang(lang) {
        const t = TRANSLATIONS[lang];
        if (!t) return;
        currentLang = lang;
        const isRTL = RTL_LANGS.includes(lang);
        document.documentElement.dir = isRTL ? "rtl" : "ltr";
        document.documentElement.lang = lang;
        document.documentElement.setAttribute("data-lang", lang);

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (t[key]) el.innerHTML = t[key].replace(/\n/g, "<br>");
        });

        document.getElementById("hero-names").innerHTML =
          `${t.name1}<span class="amp">&</span>${t.name2}`;
        document.title = `Mariage ${t.name1} & ${t.name2}`;

        document.querySelectorAll(".lang-btn").forEach((b) =>
          b.classList.toggle("active", b.getAttribute("data-lang") === lang)
        );
        updateCountdown();
      }

      /* ---------- Countdown ---------- */
      function updateCountdown() {
        const diff = Math.max(0, WEDDING_DATE - new Date());
        const t = TRANSLATIONS[currentLang];
        const units = [
          { v: Math.floor(diff / 86400000), l: t.days },
          { v: Math.floor((diff / 3600000) % 24), l: t.hours },
          { v: Math.floor((diff / 60000) % 60), l: t.minutes },
          { v: Math.floor((diff / 1000) % 60), l: t.seconds },
        ];
        document.getElementById("countdown").innerHTML = units
          .map((u) => `<div><div class="cd-num">${u.v}</div><div class="cd-label">${u.l}</div></div>`)
          .join("");
      }

      /* ---------- Toggle présence ---------- */
      let comesValue = null;
      function setComes(val) {
        comesValue = val;
        document.getElementById("comes-yes").classList.toggle("active", val === true);
        document.getElementById("comes-no").classList.toggle("active", val === false);
        document.getElementById("comes-details").classList.toggle("hidden", val !== true);
        const hint = document.getElementById("comes-hint");
        if (hint) hint.style.display = val === null ? "" : "none";
      }

      /* ---------- Pré-remplissage ---------- */
      let prefillPhone = "";
      let prefillTg = "";

      /* ---------- Envoi RSVP (même payload que le save-the-date) ---------- */
      async function submitRSVP() {
        const t = TRANSLATIONS[currentLang];
        const btn = document.getElementById("submit-btn");
        const status = document.getElementById("form-status");

        const firstName = document.getElementById("field-firstName").value.trim();
        const lastName = document.getElementById("field-lastName").value.trim();
        const email = document.getElementById("field-email").value.trim();
        const guests = comesValue ? document.getElementById("field-guests").value : "0";
        const parking = comesValue ? document.getElementById("field-parking").checked : false;
        const message = document.getElementById("field-message").value.trim();
        const restrictions = comesValue ? document.getElementById("field-restrictions").value.trim() : "";
        const comes = comesValue;

        if (!firstName || !lastName) {
          status.textContent = t.error_name;
          status.className = "form-status error";
          return;
        }
        if (comesValue === null) {
          status.textContent = t.error_comes;
          status.className = "form-status error";
          return;
        }

        btn.disabled = true;
        status.textContent = t.sending;
        status.className = "form-status sending";

        const payload = {
          firstName, lastName, email, guests, parking, message, restrictions,
          comes, lang: currentLang, phone: prefillPhone, tg: prefillTg,
        };

        try {
          if (!APPS_SCRIPT_URL) {
            console.log("📋 Mode démo — RSVP:", payload);
            await new Promise((r) => setTimeout(r, 700));
          } else {
            await fetch(APPS_SCRIPT_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          }

          const t2 = TRANSLATIONS[currentLang];
          const title = document.querySelector("#success-message .success-text");
          const sub = document.querySelector("#success-message .success-sub");
          if (comesValue) {
            title.innerHTML = t2.success_title;
            sub.innerHTML = (t2.success_sub || "").replace(/\n/g, "<br>");
          } else {
            title.innerHTML = t2.success_title_no || t2.success_title;
            sub.innerHTML = (t2.success_sub_no || t2.success_sub || "").replace(/\n/g, "<br>");
          }
          document.getElementById("rsvp-form-wrapper").style.display = "none";
          document.getElementById("success-message").classList.add("visible");
        } catch (err) {
          console.error("Erreur RSVP:", err);
          status.textContent = t.error;
          status.className = "form-status error";
          btn.disabled = false;
        }
      }

      /* ---------- Reveal au scroll ---------- */
      const io = new IntersectionObserver(
        (entries) => entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add("in"); }),
        { threshold: 0.12 }
      );
      document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

      /* ---------- Démarrage ---------- */
      setLang(detectLang());
      setInterval(updateCountdown, 1000);

      /* Pré-remplissage via URL ?p= (téléphone) ou ?t= (telegram) */
      (async function prefillFromURL() {
        const params = new URLSearchParams(window.location.search);
        const phone = params.get("p");
        const tgUser = params.get("t");
        prefillPhone = phone || "";
        prefillTg = tgUser || "";
        if ((!phone && !tgUser) || !APPS_SCRIPT_URL) return;
        try {
          let url = APPS_SCRIPT_URL;
          if (phone) url += "?p=" + encodeURIComponent(phone);
          else if (tgUser) url += "?t=" + encodeURIComponent(tgUser);
          const resp = await fetch(url);
          const data = await resp.json();
          if (data.found) {
            document.getElementById("field-firstName").value = data.firstName || "";
            document.getElementById("field-lastName").value = data.lastName || "";
            document.getElementById("field-email").value = data.email || "";
          }
        } catch (err) {
          console.warn("Prefill échoué:", err);
        }
      })();
    </script>
